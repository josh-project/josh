[package]
authors = ["Josh Project authors <contact@josh-project.dev>"]
description = "Josh CLI"
edition = "2024"
keywords = ["git", "monorepo", "workflow", "scm"]
license-file = "../LICENSE"
name = "josh-cli"
readme = "../README.md"
repository = "https://github.com/josh-project/josh"
version = "26.8.28"

[dependencies]
anyhow.workspace = true
glob = "0.3.4"
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
defer.workspace = true
clap.workspace = true
dunce.workspace = true
juniper.workspace = true
gix.workspace = true
gix-hash.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
url.workspace = true

arboard = { version = "^3.6", default-features = false }

josh-changes.workspace = true
josh-core.workspace = true
josh-compose.workspace = true
josh-compose-podman.workspace = true
josh-search.workspace = true
josh-github-auth.workspace = true
josh-github-keyring.workspace = true
josh-github-graphql.workspace = true
josh-github-changes.workspace = true
josh-gerrit-changes.workspace = true
josh-graphql.workspace = true
josh-link.workspace = true
josh-templates.workspace = true

[dev-dependencies]
gix-actor.workspace = true
tempfile.workspace = true

[features]
codesign = []

[[bin]]
name = "josh-filter"
path = "src/bin/josh-filter.rs"
