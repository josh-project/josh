[workspace]
resolver = "2"
members = [
    "axum-cgi",
    "axum-cgi-server",
    "josh-core",
    "josh-memodb",
    "josh-cli",
    "josh-filter",
    "josh-gix-ext",
    "josh-git-serde",
    "josh-graphql",
    "josh-link",
    "josh-proxy",
    "josh-rpc",
    "josh-search",
    "josh-ssh-shell",
    "josh-templates",
    "josh-starlark",
    "cq/josh-cq",
    "cq/josh-cq-test-components",
    "josh-changes",
    "josh-compose",
    "josh-compose-backend",
    "josh-compose-podman",

    "forges/josh-github-changes",
    "forges/josh-github-graphql",
    "forges/josh-github-codegen-graphql",
    "forges/josh-github-webhooks",
    "forges/josh-github-auth",
    "forges/josh-github-keyring",
    "forges/josh-gerrit-changes",

    "deployment/josh-test-webhook-client",
    "deployment/josh-test-webhook-service",
    "deployment/josh-command-middleware",
]

exclude = ["josh-gui", "devtools", "vendor/rust-lang/glob"]

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23.0"
defer = "0.2.1"
env_logger = "0.11.11"
log = "0.4.33"
mime = "0.3"
parking_lot = "0.12.5"
form_urlencoded = "1.2.2"
futures = "0.3.33"
gix = { version = "0.86.0", default-features = false, features = ["sha1", "parallel", "revision", "tree-editor"] }
gix-actor = "^0.41"
gix-features = { version = "0.49", features = ["progress"] }
gix-hash = { version = "^0.26", features = ["sha1"] }
gix-object = "0.63.0"
gix-odb = "0.83"
gix-pack = { version = "0.73", features = ["sha1", "object-cache-dynamic"] }
gix-command = "0.9.1"
gix-diff = { version = "0.66.0", default-features = false, features = ["blob"] }
gix-filter = "0.33.0"
gix-glob = "0.27.0"
gix-merge = { version = "0.19.0", default-features = false, features = ["sha1"] }
gix-revwalk = "0.34.0"
gix-worktree = { version = "0.55.0", default-features = false, features = ["attributes"] }
gix-revision = { version = "0.48.0", default-features = false, features = ["merge_base"] }
gix-zlib = "0.1"
gix-config = "0.59.0"
gix-submodule = "0.33.0"
libc = "0.2.189"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["std", "derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = "1.1.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dunce = "1.0.5"
socket2 = "0.6.3"
tempfile = "3.27.0"
hex = "0.4.3"
secret-vault-value = "^1"
hmac = "^0.13"
sha2 = "^0.11"
http = "^1"
chrono = { version = "^0", default-features = false, features = ["serde", "alloc"] }
dirs = "6"
jsonwebtoken = "11"
bytes = "1.12.1"
rand = "0.10.2"
backon = "1.6.0"
futures-util = "0.3.33"
thiserror = "2.0.19"
axum-auth = "0.8.1"
bincode = "^2"
tower-http = { version = "0.7", features = ["trace"] }
proc-macro2 = "^1"
prettyplease = "0.2.37"
graphql_client = "^0.16"
graphql_client_codegen = { version = "^0.16.0" }

axum-cgi = { path = "axum-cgi", version = "26.8.28" }
josh-filter = { path = "josh-filter", version = "26.8.28" }
josh-gix-ext = { path = "josh-gix-ext", version = "26.8.28" }
josh-git-serde = { path = "josh-git-serde", version = "26.8.28" }
josh-changes = { path = "josh-changes", version = "26.8.28" }
josh-core = { path = "josh-core", version = "26.8.28" }
josh-memodb = { path = "josh-memodb", version = "26.8.28" }
josh-compose = { path = "josh-compose", version = "26.8.28" }
josh-compose-backend = { path = "josh-compose-backend", version = "26.8.28" }
josh-compose-podman = { path = "josh-compose-podman", version = "26.8.28" }
josh-graphql = { path = "josh-graphql", version = "26.8.28" }
josh-link = { path = "josh-link", version = "26.8.28" }
josh-rpc = { path = "josh-rpc", version = "26.8.28" }
josh-search = { path = "josh-search", version = "26.8.28" }
josh-starlark = { path = "josh-starlark", version = "26.8.28" }
josh-templates = { path = "josh-templates", version = "26.8.28" }

# Forges support
josh-github-changes = { path = "forges/josh-github-changes", version = "26.8.28" }
josh-github-graphql = { path = "forges/josh-github-graphql", version = "26.8.28" }
josh-github-codegen-graphql = { path = "forges/josh-github-codegen-graphql", version = "26.8.28" }
josh-github-webhooks = { path = "forges/josh-github-webhooks", version = "26.8.28" }
josh-github-auth = { path = "forges/josh-github-auth", version = "26.8.28" }
josh-github-keyring = { path = "forges/josh-github-keyring", version = "26.8.28" }
josh-gerrit-changes = { path = "forges/josh-gerrit-changes", version = "26.8.28" }

josh-cq-test-components = { path = "cq/josh-cq-test-components", version = "26.8.28" }

# Deployment
josh-test-webhook-service = { path = "deployment/josh-test-webhook-service", version = "26.8.28" }
josh-test-webhook-client = { path = "deployment/josh-test-webhook-client", version = "26.8.28" }
josh-command-middleware = { path = "deployment/josh-command-middleware", version = "26.8.28" }


[workspace.dependencies.juniper]
version = "0.17.1"
default-features = false
features = ["expose-test-schema"]

[workspace.dependencies.tokio]
version = "1.53.1"
features = [
    "fs",
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "net",
    "process",
    "signal",
]

[workspace.dependencies.tokio-util]
version = "0.7.19"
features = ["compat"]

[workspace.dependencies.reqwest]
version = "^0.13"
default-features = false
features = ["blocking", "default-tls", "json"]

[workspace.dependencies.reqwest-middleware]
version = "^0.5"
features = ["json"]

[workspace.dependencies.tracing]
version = "0.1.44"
features = ["max_level_trace", "release_max_level_trace"]

[workspace.dependencies.clap]
version = "4.6.5"
features = ["derive", "env", "help", "std", "usage"]
default-features = false

[workspace.dependencies.axum]
version = "^0.8"
features = ["macros"]

[workspace.dependencies.tower]
version = "0.5"
features = ["util"]

[workspace.dependencies.url]
version = "^2"
features = ["serde"]

[workspace.dependencies.async-trait]
version = "0.1"

[workspace.dependencies.headers]
version = "0.4"

# "josh run" builds filtered workspace trees that lack .git directories,
# causing cargo to resolve josh-* crates from crates.io instead of locally.
# This section forces cargo to always use the local versions.
[patch.crates-io]
glob = { path = "vendor/rust-lang/glob" }
axum-cgi = { path = "axum-cgi" }
josh-filter = { path = "josh-filter" }
josh-gix-ext = { path = "josh-gix-ext" }
josh-git-serde = { path = "josh-git-serde" }
josh-changes = { path = "josh-changes" }
josh-core = { path = "josh-core" }
josh-memodb = { path = "josh-memodb" }
josh-compose = { path = "josh-compose" }
josh-compose-backend = { path = "josh-compose-backend" }
josh-compose-podman = { path = "josh-compose-podman" }
josh-graphql = { path = "josh-graphql" }
josh-link = { path = "josh-link" }
josh-rpc = { path = "josh-rpc" }
josh-starlark = { path = "josh-starlark" }
josh-templates = { path = "josh-templates" }
josh-github-changes = { path = "forges/josh-github-changes" }
josh-github-graphql = { path = "forges/josh-github-graphql" }
josh-github-codegen-graphql = { path = "forges/josh-github-codegen-graphql" }
josh-github-webhooks = { path = "forges/josh-github-webhooks" }
josh-github-auth = { path = "forges/josh-github-auth" }
josh-github-keyring = { path = "forges/josh-github-keyring" }
josh-gerrit-changes = { path = "forges/josh-gerrit-changes" }
josh-cq-test-components = { path = "cq/josh-cq-test-components" }
josh-test-webhook-service = { path = "deployment/josh-test-webhook-service" }
josh-test-webhook-client = { path = "deployment/josh-test-webhook-client" }
josh-command-middleware = { path = "deployment/josh-command-middleware" }
