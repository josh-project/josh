[package]
name = "git-tree-trace"
version = "0.1.0"
edition = "2021"

[dependencies]
gix = { version = "0.86", default-features = false, features = ["sha1"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
