[package]
name = "josh-core"
version = "26.8.28"
repository = "https://ithub.com/josh-project/josh"
authors = ["Josh Project authors <contact@josh-project.dev>"]
license-file = "../LICENSE"
description = "GIT virtualization proxy"
keywords = ["git", "monorepo", "workflow", "scm"]
readme = "../README.md"
edition = "2024"

[[bench]]
name = "ultrawide_parse"
harness = false

[[bench]]
name = "ultrawide_pin"
harness = false

[[bench]]
name = "ultrawide_pin_hook"
harness = false

[[bench]]
name = "deephistory_subdir"
harness = false

[[bench]]
name = "deephistory_subdir_sparse"
harness = false

[[bench]]
name = "deephistory_subdir_distributed"
harness = false

[[bench]]
name = "deephistory_glob"
harness = false

[[bench]]
name = "widetree_glob"
harness = false

[[bench]]
name = "deephistory_prefix_flush"
harness = false

[[bench]]
name = "refs_filter_update"
harness = false

[dependencies]
backtrace = "0.3.76"
bitvec = "1.1.1"
git-version = "0.3.9"
glob = "0.3.4"
indoc = "2.0.7"
itertools = "0.15.0"
percent-encoding = "2.3.2"
pest = "2.8.8"
pest_derive = "2.8.8"
strfmt = "0.2.5"
sled = "0.34.7"
smallvec = "1.15.2"

anyhow.workspace = true
chrono.workspace = true
tempfile.workspace = true
gix.workspace = true
gix-actor.workspace = true
gix-object.workspace = true
gix-config.workspace = true
gix-submodule.workspace = true
gix-hash.workspace = true
hex.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
toml.workspace = true

josh-filter.workspace = true
josh-gix-ext.workspace = true
josh-memodb.workspace = true
josh-search.workspace = true
josh-starlark.workspace = true

[dev-dependencies]
rand = "0.10.2"
criterion = "0.5"
josh-test-support = { path = "../devtools/josh-test-support" }
# Used by tests/cache_lock.rs to probe the sled file lock directly.
sled = "0.34.7"

[[bench]]
name = "unapply"
harness = false
