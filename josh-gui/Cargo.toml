[package]
name = "josh-gui"
version = "0.1.0"
edition = "2024"
resolver = "2"
authors = ["Josh Project authors <contact@josh-project.dev>"]
description = "Josh GUI (Dioxus desktop)"
license-file = "../LICENSE"
repository = "https://github.com/josh-project/josh"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "^0"
clap = { version = "4", features = ["derive"] }
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
josh-changes = { path = "../josh-changes" }
josh-core = { path = "../josh-core" }
josh-github-changes = { path = "../forges/josh-github-changes" }
gix-hash = { version = "^0.26", features = ["sha1"] }
tokio = { version = "1", features = ["time"] }

# Same as the root workspace: use the vendored glob fork, which keeps the
# Pattern token APIs public that josh-filter relies on.
[patch.crates-io]
glob = { path = "../vendor/rust-lang/glob" }
