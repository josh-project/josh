[package]
name = "josh-search"
version = "26.7.28"
repository = "https://github.com/josh-project/josh"
authors = ["Josh Project authors <contact@josh-project.dev>"]
license-file = "../LICENSE"
description = "Trigram based code search index for git repositories"
keywords = ["git", "search", "index", "trigram"]
readme = "../README.md"
edition = "2024"

[[bench]]
name = "trigram"
harness = false

[dependencies]
anyhow.workspace = true
gix-hash.workspace = true
gix-object.workspace = true

[dev-dependencies]
git2.workspace = true
josh-gix-ext = { workspace = true, features = ["git2"] }
gix.workspace = true
criterion2 = { version = "3.0.4" }
rand = "0.10.2"
tempfile.workspace = true
tracing.workspace = true
josh-core.workspace = true
josh-test-support = { path = "../devtools/josh-test-support" }
